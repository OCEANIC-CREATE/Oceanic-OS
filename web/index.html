<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oceanic-OS Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #0b172a; color: #e2e8f0; }
    h1 { margin-bottom: .5rem; }
    code, pre { background: rgba(255,255,255,.08); padding: 1rem; border-radius: .75rem; display: block; }
    .section { margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <h1>Oceanic-OS Dashboard</h1>
  <p>A minimal Oceanic-OS front end served by the backend API.</p>

  <div class="section">
    <h2>API Endpoints</h2>
    <ul>
      <li><code>GET /health</code></li>
      <li><code>GET /dashboard</code></li>
      <li><code>GET /identities</code></li>
      <li><code>POST /identity</code></li>
    </ul>
  </div>

  <div class="section">
    <h2>Dashboard</h2>
    <pre id="dashboard">Loading dashboard…</pre>
  </div>

  <script>
    async function loadDashboard() {
      const response = await fetch('/dashboard');
      const data = await response.json();
      document.getElementById('dashboard').textContent = JSON.stringify(data, null, 2);
    }
    loadDashboard();
  </script>
</body>
</html>
